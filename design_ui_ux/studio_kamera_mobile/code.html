            countdownNumber.classList.add('scale-125');
            setTimeout(() => countdownNumber.classList.remove('scale-125'), 200);
          } else {
            clearInterval(countdownInterval);
            countdownNumber.textContent = '0';
            
            // Trigger Studio Flash Animation
            flashScreen.classList.remove('opacity-0');
            flashScreen.classList.add('opacity-90');
            
            setTimeout(() => {
              flashScreen.classList.remove('opacity-90');
              flashScreen.classList.add('opacity-0');
              countdownNumber.textContent = '✨';
              
              setTimeout(() => {
                isCapturing = false;
                countdownNumber.textContent = currentTimerDuration;
              }, 600);
            }, 120);
          }
        }, 1000);
      });

      // Flash Mode Toggle
      flashToggleBtn.addEventListener('click', () => {
        flashStateIndex = (flashStateIndex + 1) % flashStates.length;
        flashLabel.textContent = flashStates[flashStateIndex];
      });

      // Camera Switch Spin
      let flipped = false;
      cameraFlipBtn.addEventListener('click', () => {
        flipped = !flipped;
        flipIcon.style.transform = flipped ? 'rotate(180deg)' : 'rotate(0deg)';
      });

      // Open / Close Bottom Drawer
      function openDrawer() {
        settingsBackdrop.classList.remove('pointer-events-none');
        settingsBackdrop.classList.add('opacity-100');
        settingsSheet.classList.remove('translate-y-full');
      }

      function closeDrawer() {
        settingsBackdrop.classList.remove('opacity-100');
        settingsBackdrop.classList.add('pointer-events-none');
        settingsSheet.classList.add('translate-y-full');
      }

      openSettingsBtn.addEventListener('click', openDrawer);
      peekDrawerBtn.addEventListener('click', openDrawer);
      closeSettingsBtn.addEventListener('click', closeDrawer);
      saveSettingsBtn.addEventListener('click', closeDrawer);
      settingsBackdrop.addEventListener('click', (e) => {
        if (e.target === settingsBackdrop) closeDrawer();
      });

      // Timer Select Chips
      timerChips.forEach(chip => {
        chip.addEventListener('click', () => {
          timerChips.forEach(c => {
            c.classList.remove('bg-primary-container', 'text-on-primary-fixed', 'font-semibold');
            c.classList.add('bg-surface-container-high', 'text-on-surface');
          });
          chip.classList.remove('bg-surface-container-high', 'text-on-surface');
          chip.classList.add('bg-primary-container', 'text-on-primary-fixed', 'font-semibold');
          currentTimerDuration = parseInt(chip.getAttribute('data-timer'), 10);
          countdownNumber.textContent = currentTimerDuration;
        });
      });

      // Layout Select Chips
      layoutChips.forEach(chip => {
        chip.addEventListener('click', () => {
          layoutChips.forEach(c => {
            c.classList.remove('bg-primary-container', 'text-on-primary-fixed');
            c.classList.add('bg-surface-container-high', 'text-on-surface');
          });
          chip.classList.remove('bg-surface-container-high', 'text-on-surface');
          chip.classList.add('bg-primary-container', 'text-on-primary-fixed');
        });
      });
    })();
  </script>
</div></main></body></html>
